<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Code Generator — ARIXO</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <a class="back" href="../../../index.html">
        ← Back to ARIXO
    </a>

        <div class="card">

            <div class="logo">ARIXO</div>

            <h1>QR Code Generator</h1>

            <p class="subtitle">
                Generate a QR code from text, links or any information.
            </p>

            <textarea
                id="qrInput"
                placeholder="Enter text or URL here...

Example:
https://arixo.com"
            ></textarea>

            <div class="button-grid">

                <button onclick="generateQR()">
                    Generate QR
                </button>

                <button class="secondary" onclick="downloadQR()">
                    Download
                </button>

                <button class="clear-btn" onclick="clearTool()">
                    Clear
                </button>

            </div>

            <div id="qrBox">
                <p id="qrPlaceholder">
                    Your QR code will appear here.
                </p>
            </div>

            <div id="result"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
