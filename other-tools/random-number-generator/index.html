<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Random Number Generator — ARIXO</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <a class="back" href="../../../index.html">
        ← Back to ARIXO
    </a>
        <div class="card">

            <div class="logo">ARIXO</div>

            <h1>Random Number Generator</h1>

            <p class="subtitle">
                Generate random numbers within your chosen range.
            </p>

            <div class="input-grid">

                <div class="field">
                    <label for="min">Minimum Number</label>
                    <input type="number" id="min" value="1">
                </div>

                <div class="field">
                    <label for="max">Maximum Number</label>
                    <input type="number" id="max" value="100">
                </div>

                <div class="field">
                    <label for="quantity">How Many?</label>
                    <input type="number" id="quantity" value="1" min="1" max="100">
                </div>

            </div>

            <label class="checkbox">
                <input type="checkbox" id="allowDuplicates" checked>
                Allow duplicate numbers
            </label>

            <div class="buttons">

                <button id="generateBtn" class="primary">
                    Generate Random Numbers
                </button>

                <button id="copyBtn">
                    Copy
                </button>

                <button id="clearBtn">
                    Clear
                </button>

            </div>

            <textarea
                id="output"
                readonly
                placeholder="Your random numbers will appear here..."
            ></textarea>

            <div id="result"></div>

        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
