<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JSON Formatter — ARIXO</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <a class="back" href="../../../index.html">
    ← Back to ARIXO
</a>

        <div class="card">

            <div class="logo">ARIXO</div>

            <h1>JSON Formatter</h1>

            <p class="subtitle">
                Format, minify and validate JSON instantly.
            </p>

            <textarea
                id="jsonInput"
                placeholder='Paste your JSON here...

Example:
{"name":"Arikul","age":20}'
            ></textarea>

            <div class="button-grid">

                <button onclick="formatJSON()">
                    Format JSON
                </button>

                <button onclick="minifyJSON()">
                    Minify JSON
                </button>

                <button class="secondary" onclick="copyJSON()">
                    Copy
                </button>

                <button class="clear-btn" onclick="clearTool()">
                    Clear
                </button>

            </div>

            <div id="result"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
