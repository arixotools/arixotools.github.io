<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Calculator - ARIXO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">

        <a href="../../../../index.html" class="back-btn">← Back to ARIXO</a>

        <section class="calculator-card">

            <div class="icon">🏦</div>

            <h1>Loan Calculator</h1>

            <p class="subtitle">
                Estimate your monthly loan payment, total interest and total repayment.
            </p>

            <div class="input-group">
                <label for="loanAmount">Loan Amount (₹)</label>
                <input
                    type="number"
                    id="loanAmount"
                    placeholder="Example: 500000"
                    min="1"
                    step="0.01"
                >
            </div>

            <div class="input-group">
                <label for="interestRate">Annual Interest Rate (%)</label>
                <input
                    type="number"
                    id="interestRate"
                    placeholder="Example: 8.5"
                    min="0"
                    step="0.01"
                >
            </div>

            <div class="input-group">
                <label for="loanYears">Loan Tenure (Years)</label>
                <input
                    type="number"
                    id="loanYears"
                    placeholder="Example: 5"
                    min="0.1"
                    step="0.1"
                >
            </div>

            <button id="calculateBtn" class="calculate-btn">
                Calculate Loan
            </button>

            <button id="clearBtn" class="clear-btn">
                Clear
            </button>

            <div id="error" class="error"></div>

            <div class="result-box">

                <div class="main-result">
                    <span>Monthly Payment</span>
                    <strong id="monthlyPayment">₹0.00</strong>
                </div>

                <div class="result-row">
                    <span>Principal Amount</span>
                    <strong id="principalAmount">₹0.00</strong>
                </div>

                <div class="result-row">
                    <span>Total Interest</span>
                    <strong id="totalInterest">₹0.00</strong>
                </div>

                <div class="result-row">
                    <span>Total Payment</span>
                    <strong id="totalPayment">₹0.00</strong>
                </div>

                <div class="result-row">
                    <span>Total Months</span>
                    <strong id="totalMonths">0</strong>
                </div>

            </div>

            <p class="note">
                This calculator uses a standard reducing-balance loan calculation.
            </p>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
