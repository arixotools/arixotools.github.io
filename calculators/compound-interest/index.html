<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compound Interest Calculator - ARIXO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">

        <a href="../../../../index.html" class="back-btn">← Back to ARIXO</a>

        <section class="calculator-card">

            <div class="icon">📈</div>

            <h1>Compound Interest Calculator</h1>

            <p class="subtitle">
                Calculate compound interest and the final amount with different compounding frequencies.
            </p>

            <div class="input-group">
                <label for="principal">Principal Amount (₹)</label>
                <input
                    type="number"
                    id="principal"
                    placeholder="Example: 50000"
                    min="0"
                    step="0.01"
                >
            </div>

            <div class="input-group">
                <label for="rate">Annual Interest Rate (%)</label>
                <input
                    type="number"
                    id="rate"
                    placeholder="Example: 8"
                    min="0"
                    step="0.01"
                >
            </div>

            <div class="input-group">
                <label for="time">Time (Years)</label>
                <input
                    type="number"
                    id="time"
                    placeholder="Example: 5"
                    min="0"
                    step="0.1"
                >
            </div>

            <div class="input-group">
                <label for="frequency">Compounding Frequency</label>

                <select id="frequency">
                    <option value="1">Annually</option>
                    <option value="2">Half-Yearly</option>
                    <option value="4">Quarterly</option>
                    <option value="12" selected>Monthly</option>
                    <option value="365">Daily</option>
                </select>
            </div>

            <button id="calculateBtn" class="calculate-btn">
                Calculate Compound Interest
            </button>

            <button id="clearBtn" class="clear-btn">
                Clear
            </button>

            <div id="error" class="error"></div>

            <div class="result-box">

                <div class="main-result">
                    <span>Compound Interest</span>
                    <strong id="compoundInterest">₹0.00</strong>
                </div>

                <div class="result-row">
                    <span>Principal Amount</span>
                    <strong id="principalResult">₹0.00</strong>
                </div>

                <div class="result-row">
                    <span>Interest Rate</span>
                    <strong id="rateResult">0%</strong>
                </div>

                <div class="result-row">
                    <span>Time</span>
                    <strong id="timeResult">0 Years</strong>
                </div>

                <div class="result-row">
                    <span>Final Amount</span>
                    <strong id="finalAmount">₹0.00</strong>
                </div>

            </div>

            <div class="formula-box">
                <strong>Formula</strong>
                <span>A = P(1 + R/n)<sup>nt</sup></span>
            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
