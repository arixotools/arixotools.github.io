<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Percentage Calculator - ARIXO</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="page">

    <div class="card">

        <div class="brand">ARIXO</div>

        <div class="icon">%</div>

        <h1>Percentage Calculator</h1>

        <p class="subtitle">
            Calculate percentages quickly and easily.
        </p>


        <!-- 1 -->
        <section class="calculator-box">

            <h2>What is X% of Y?</h2>

            <div class="input-row">

                <input
                    type="number"
                    id="percentOf"
                    placeholder="Percentage (%)"
                >

                <span>% of</span>

                <input
                    type="number"
                    id="numberOf"
                    placeholder="Number"
                >

            </div>

            <button onclick="calculatePercentOf()">
                Calculate
            </button>

            <div class="result" id="result1">
                Result will appear here.
            </div>

        </section>


        <!-- 2 -->
        <section class="calculator-box">

            <h2>X is what % of Y?</h2>

            <div class="input-row">

                <input
                    type="number"
                    id="part"
                    placeholder="Part (X)"
                >

                <span>of</span>

                <input
                    type="number"
                    id="whole"
                    placeholder="Whole (Y)"
                >

            </div>

            <button onclick="calculateWhatPercent()">
                Calculate
            </button>

            <div class="result" id="result2">
                Result will appear here.
            </div>

        </section>


        <!-- 3 -->
        <section class="calculator-box">

            <h2>Percentage Increase / Decrease</h2>

            <div class="input-row">

                <input
                    type="number"
                    id="oldValue"
                    placeholder="Original value"
                >

                <span>→</span>

                <input
                    type="number"
                    id="newValue"
                    placeholder="New value"
                >

            </div>

            <button onclick="calculateChange()">
                Calculate
            </button>

            <div class="result" id="result3">
                Result will appear here.
            </div>

        </section>


        <button class="clear-btn" onclick="clearAll()">
            Clear All
        </button>


        <a class="back" href="../../../../index.html">
            ← Back to ARIXO
        </a>

    </div>

</main>

<script src="script.js"></script>

</body>
</html>
