<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI Calculator - ARIXO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">

        <a href="../../../../index.html" class="back-btn">← Back to ARIXO</a>

        <section class="calculator-card">

            <div class="icon">💰</div>

            <h1>EMI Calculator</h1>

            <p class="subtitle">
                Calculate your monthly loan EMI, total interest and total payment.
            </p>

            <div class="input-group">
                <label for="loanAmount">Loan Amount (₹)</label>
                <input
                    type="number"
                    id="loanAmount"
                    placeholder="Example: 500000"
                    min="1"
                >
            </div>

            <div class="input-group">
                <label for="interestRate">Annual Interest Rate (%)</label>
                <input
                    type="number"
                    id="interestRate"
                    placeholder="Example: 8.5"
                    min="0"
                    step="0.01"
                >
            </div>

            <div class="input-group">
                <label for="loanYears">Loan Tenure (Years)</label>
                <input
                    type="number"
                    id="loanYears"
                    placeholder="Example: 5"
                    min="1"
                    step="0.1"
                >
            </div>

            <button id="calculateBtn" class="calculate-btn">
                Calculate EMI
            </button>

            <button id="clearBtn" class="clear-btn">
                Clear
            </button>

            <div id="error" class="error"></div>

            <div id="result" class="result-box">

                <div class="result-item main-result">
                    <span>Monthly EMI</span>
                    <strong id="monthlyEmi">₹0.00</strong>
                </div>

                <div class="result-item">
                    <span>Total Interest</span>
                    <strong id="totalInterest">₹0.00</strong>
                </div>

                <div class="result-item">
                    <span>Total Payment</span>
                    <strong id="totalPayment">₹0.00</strong>
                </div>

            </div>

            <p class="note">
                EMI is calculated using the standard reducing-balance loan formula.
            </p>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
