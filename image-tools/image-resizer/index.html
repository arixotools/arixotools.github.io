<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Image Resizer — ARIXO</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <a class="back" href="../../../index.html">
        ← Back to ARIXO
    </a>

    <div class="card">

      <div class="logo">ARIXO</div>

      <h1>Image Resizer</h1>

      <p class="subtitle">
        Resize your images to any width and height instantly.
      </p>

      <div class="upload-box">

        <input
          type="file"
          id="imageInput"
          accept="image/*"
          onchange="loadImage(event)"
        >

        <label for="imageInput">
          📷 Choose Image
        </label>

        <p id="fileName">
          No image selected
        </p>

      </div>

      <div class="preview-box">

        <img id="preview" alt="Image Preview">

        <p id="dimensions"></p>

      </div>

      <div class="resize-box">

        <div class="input-group">
          <label for="width">Width (px)</label>
          <input
            type="number"
            id="width"
            min="1"
            placeholder="Width"
          >
        </div>

        <div class="input-group">
          <label for="height">Height (px)</label>
          <input
            type="number"
            id="height"
            min="1"
            placeholder="Height"
          >
        </div>

      </div>

      <label class="checkbox">
        <input
          type="checkbox"
          id="keepRatio"
          checked
        >
        Keep aspect ratio
      </label>

      <button onclick="resizeImage()">
        Resize Image
      </button>

      <div id="result"></div>

      <a
        id="downloadBtn"
        class="download-btn"
        download="arixo-resized-image.jpg"
      >
        Download Resized Image
      </a>

      <button
        class="clear-btn"
        onclick="clearTool()"
      >
        Clear
      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
