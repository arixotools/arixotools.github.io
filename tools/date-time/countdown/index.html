<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown Timer — ARIXO</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <a class="back" href="../../../index.html">
    ← Back to ARIXO
</a>

    <div class="card">

      <div class="logo">ARIXO</div>

      <h1>Countdown Timer</h1>

      <p class="subtitle">
        Set a date and count down to it.
      </p>

      <div class="input-group">
        <label for="targetDate">Target Date & Time</label>
        <input type="datetime-local" id="targetDate">
      </div>

      <button onclick="startCountdown()">
        Start Countdown
      </button>

      <div id="result" class="result">
        Select a future date and start the countdown.
      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
