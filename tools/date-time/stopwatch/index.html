<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Stopwatch — ARIXO</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <a class="back" href="../../../index.html">
    ← Back to ARIXO
</a>

    <div class="card">

      <div class="logo">ARIXO</div>

      <h1>Stopwatch</h1>

      <p class="subtitle">
        Track time accurately with a simple stopwatch.
      </p>

      <div id="display">
        00:00:00
      </div>

      <div class="buttons">

        <button onclick="startStopwatch()">
          Start
        </button>

        <button onclick="pauseStopwatch()">
          Pause
        </button>

        <button onclick="resetStopwatch()">
          Reset
        </button>

      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
