<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Generator — ARIXO</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <a class="back" href="../../../index.html">
        ← Back to ARIXO
    </a>

        <div class="card">

            <div class="logo">ARIXO</div>

            <h1>Password Generator</h1>

            <p class="subtitle">
                Generate strong random passwords instantly.
            </p>

            <div class="password-box">
                <input
                    type="text"
                    id="passwordOutput"
                    placeholder="Your password will appear here..."
                    readonly
                >

                <button class="copy-small" onclick="copyPassword()">
                    Copy
                </button>
            </div>

            <div class="settings">

                <label for="length">
                    Password Length:
                    <strong id="lengthValue">16</strong>
                </label>

                <input
                    type="range"
                    id="length"
                    min="6"
                    max="50"
                    value="16"
                    oninput="updateLength()"
                >

                <label class="check">
                    <input type="checkbox" id="uppercase" checked>
                    Include Uppercase (A-Z)
                </label>

                <label class="check">
                    <input type="checkbox" id="lowercase" checked>
                    Include Lowercase (a-z)
                </label>

                <label class="check">
                    <input type="checkbox" id="numbers" checked>
                    Include Numbers (0-9)
                </label>

                <label class="check">
                    <input type="checkbox" id="symbols" checked>
                    Include Symbols (!@#$)
                </label>

            </div>

            <div class="button-grid">

                <button onclick="generatePassword()">
                    Generate Password
                </button>

                <button class="clear-btn" onclick="clearTool()">
                    Clear
                </button>

            </div>

            <div id="strength"></div>

            <div id="result"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
