<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Unit Converter - ARIXO</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <a href="../../../../index.html" class="back-btn">
            ← Back to ARIXO
        </a>

        <section class="converter-card">

            <div class="icon">📏</div>

            <h1>Unit Converter</h1>

            <p class="subtitle">
                Convert different units quickly and accurately.
            </p>


            <!-- Category -->

            <div class="input-group">

                <label for="category">
                    Category
                </label>

                <select id="category">

                    <option value="length">
                        Length
                    </option>

                    <option value="weight">
                        Weight
                    </option>

                    <option value="temperature">
                        Temperature
                    </option>

                    <option value="area">
                        Area
                    </option>

                    <option value="volume">
                        Volume
                    </option>

                    <option value="speed">
                        Speed
                    </option>

                    <option value="time">
                        Time
                    </option>

                </select>

            </div>


            <!-- Value -->

            <div class="input-group">

                <label for="value">
                    Value
                </label>

                <input
                    type="number"
                    id="value"
                    placeholder="Enter value"
                    step="any"
                >

            </div>


            <!-- From -->

            <div class="input-group">

                <label for="fromUnit">
                    From
                </label>

                <select id="fromUnit"></select>

            </div>


            <!-- To -->

            <div class="input-group">

                <label for="toUnit">
                    To
                </label>

                <select id="toUnit"></select>

            </div>


            <button
                type="button"
                id="convertBtn"
                class="convert-btn"
            >
                Convert
            </button>


            <button
                type="button"
                id="swapBtn"
                class="swap-btn"
            >
                ⇄ Swap Units
            </button>


            <button
                type="button"
                id="clearBtn"
                class="clear-btn"
            >
                Clear
            </button>


            <p id="error" class="error"></p>


            <!-- Result -->

            <div class="result-box">

                <div class="main-result">

                    <span>Converted Value</span>

                    <strong id="result">
                        0
                    </strong>

                </div>


                <div class="result-row">

                    <span>From</span>

                    <strong id="fromResult">
                        —
                    </strong>

                </div>


                <div class="result-row">

                    <span>To</span>

                    <strong id="toResult">
                        —
                    </strong>

                </div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
