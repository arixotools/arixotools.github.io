<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator - ARIXO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">

        <a href="../../../../index.html" class="back-btn">← Back to ARIXO</a>

        <section class="calculator-card">

            <div class="icon">⚖️</div>

            <h1>BMI Calculator</h1>
            <p class="subtitle">
                Calculate your Body Mass Index quickly and easily.
            </p>

            <div class="input-group">
                <label for="height">Height (cm)</label>
                <input
                    type="number"
                    id="height"
                    placeholder="Example: 170"
                    min="1"
                >
            </div>

            <div class="input-group">
                <label for="weight">Weight (kg)</label>
                <input
                    type="number"
                    id="weight"
                    placeholder="Example: 65"
                    min="1"
                >
            </div>

            <button id="calculateBtn" class="calculate-btn">
                Calculate BMI
            </button>

            <button id="clearBtn" class="clear-btn">
                Clear
            </button>

            <div id="error" class="error"></div>

            <div id="result" class="result-box">

                <div class="result-title">Your BMI</div>

                <div id="bmiValue" class="bmi-value">
                    0.0
                </div>

                <div id="bmiCategory" class="bmi-category">
                    —
                </div>

            </div>

            <div class="info-box">
                <h3>BMI Categories</h3>

                <div class="category-row">
                    <span>Underweight</span>
                    <strong>Below 18.5</strong>
                </div>

                <div class="category-row">
                    <span>Normal</span>
                    <strong>18.5 – 24.9</strong>
                </div>

                <div class="category-row">
                    <span>Overweight</span>
                    <strong>25 – 29.9</strong>
                </div>

                <div class="category-row">
                    <span>Obesity</span>
                    <strong>30+</strong>
                </div>
            </div>

            <p class="note">
                BMI is a general screening measure and may not reflect individual health.
            </p>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
