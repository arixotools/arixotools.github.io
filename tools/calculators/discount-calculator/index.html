<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Discount Calculator - ARIXO</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="page">

    <div class="card">

        <div class="brand">ARIXO</div>

        <div class="icon">🏷️</div>

        <h1>Discount Calculator</h1>

        <p class="subtitle">
            Calculate discount amount and final price instantly.
        </p>


        <div class="input-group">

            <label for="originalPrice">
                Original Price
            </label>

            <input
                type="number"
                id="originalPrice"
                placeholder="Enter original price"
                min="0"
                step="any"
            >

        </div>


        <div class="input-group">

            <label for="discountPercent">
                Discount Percentage
            </label>

            <input
                type="number"
                id="discountPercent"
                placeholder="Enter discount %"
                min="0"
                max="100"
                step="any"
            >

        </div>


        <button id="calculateBtn">
            Calculate Discount
        </button>


        <div class="result-box">

            <div class="result-item">
                <span>Discount Amount</span>
                <strong id="discountAmount">₹0.00</strong>
            </div>

            <div class="result-item">
                <span>Final Price</span>
                <strong id="finalPrice">₹0.00</strong>
            </div>

            <div class="result-item highlight">
                <span>You Save</span>
                <strong id="youSave">₹0.00</strong>
            </div>

        </div>


        <button id="clearBtn" class="secondary">
            Clear
        </button>


        <div id="message"></div>


        <a class="back" href="../../../index.html">
            ← Back to ARIXO
        </a>

    </div>

</main>

<script src="script.js"></script>

</body>
</html>
