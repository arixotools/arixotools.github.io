<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Interest Calculator - ARIXO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">

        <a href="../../../../index.html" class="back-btn">← Back to ARIXO</a>

        <section class="calculator-card">

            <div class="icon">💰</div>

            <h1>Simple Interest Calculator</h1>

            <p class="subtitle">
                Calculate simple interest and the total amount easily.
            </p>

            <div class="input-group">
                <label for="principal">Principal Amount (₹)</label>
                <input
                    type="number"
                    id="principal"
                    placeholder="Example: 50000"
                    min="0"
                    step="0.01"
                >
            </div>

            <div class="input-group">
                <label for="rate">Annual Interest Rate (%)</label>
                <input
                    type="number"
                    id="rate"
                    placeholder="Example: 8"
                    min="0"
                    step="0.01"
                >
            </div>

            <div class="input-group">
                <label for="time">Time (Years)</label>
                <input
                    type="number"
                    id="time"
                    placeholder="Example: 3"
                    min="0"
                    step="0.1"
                >
            </div>

            <button id="calculateBtn" class="calculate-btn">
                Calculate Interest
            </button>

            <button id="clearBtn" class="clear-btn">
                Clear
            </button>

            <div id="error" class="error"></div>

            <div class="result-box">

                <div class="main-result">
                    <span>Simple Interest</span>
                    <strong id="simpleInterest">₹0.00</strong>
                </div>

                <div class="result-row">
                    <span>Principal Amount</span>
                    <strong id="principalResult">₹0.00</strong>
                </div>

                <div class="result-row">
                    <span>Interest Rate</span>
                    <strong id="rateResult">0%</strong>
                </div>

                <div class="result-row">
                    <span>Time</span>
                    <strong id="timeResult">0 Years</strong>
                </div>

                <div class="result-row">
                    <span>Total Amount</span>
                    <strong id="totalAmount">₹0.00</strong>
                </div>

            </div>

            <div class="formula-box">
                <strong>Formula</strong>
                <span>SI = (P × R × T) ÷ 100</span>
            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
