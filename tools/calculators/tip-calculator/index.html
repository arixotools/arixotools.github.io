<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tip Calculator - ARIXO</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <a href="../../../../index.html" class="back-btn">
            ← Back to ARIXO
        </a>

        <section class="calculator-card">

            <div class="icon">💰</div>

            <h1>Tip Calculator</h1>

            <p class="subtitle">
                Calculate tip, total bill and the amount each person should pay.
            </p>


            <div class="input-group">

                <label for="billAmount">
                    Bill Amount (₹)
                </label>

                <input
                    type="number"
                    id="billAmount"
                    placeholder="Example: 1500"
                    min="0"
                    step="0.01"
                >

            </div>


            <div class="input-group">

                <label for="tipPercent">
                    Tip Percentage (%)
                </label>

                <input
                    type="number"
                    id="tipPercent"
                    placeholder="Example: 10"
                    value="10"
                    min="0"
                    step="0.1"
                >

            </div>


            <div class="input-group">

                <label for="people">
                    Number of People
                </label>

                <input
                    type="number"
                    id="people"
                    placeholder="Example: 2"
                    value="1"
                    min="1"
                    step="1"
                >

            </div>


            <button
                type="button"
                id="calculateBtn"
                class="calculate-btn"
            >
                Calculate Tip
            </button>


            <button
                type="button"
                id="clearBtn"
                class="clear-btn"
            >
                Clear
            </button>


            <p id="error" class="error"></p>


            <div class="result-box">

                <div class="main-result">

                    <span>Per Person</span>

                    <strong id="perPerson">
                        ₹0.00
                    </strong>

                </div>


                <div class="result-row">

                    <span>Bill Amount</span>

                    <strong id="billResult">
                        ₹0.00
                    </strong>

                </div>


                <div class="result-row">

                    <span>Tip Amount</span>

                    <strong id="tipAmount">
                        ₹0.00
                    </strong>

                </div>


                <div class="result-row">

                    <span>Total Bill</span>

                    <strong id="totalBill">
                        ₹0.00
                    </strong>

                </div>


                <div class="result-row">

                    <span>Tip Percentage</span>

                    <strong id="tipResult">
                        0%
                    </strong>

                </div>


                <div class="result-row">

                    <span>People</span>

                    <strong id="peopleResult">
                        0
                    </strong>

                </div>

            </div>


            <div class="formula-box">

                <strong>Formula</strong>

                <span>
                    Tip = Bill × Tip% ÷ 100
                </span>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
